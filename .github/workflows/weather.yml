name: Mediterranean Weather Bot

on:
  schedule:
    # כל 5 דקות, רק בחודשי הגשם (ינואר-אפריל ואוקטובר-דצמבר)
    - cron: '2-59/5 * * 1-4,10-12 *'
  workflow_dispatch:
    inputs:
      test_telegram:
        description: 'שלח הודעת בדיקה לטלגרם'
        type: boolean
        default: false

concurrency:
  group: rain-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-weather-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: rain-state-${{ github.run_id }}
          restore-keys: rain-state-

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_DIR: state
        run: python bot.py ${{ inputs.test_telegram && '--test-telegram' || '' }}

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: rain-state-${{ github.run_id }}
