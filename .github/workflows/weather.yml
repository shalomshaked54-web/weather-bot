name: Mediterranean Weather Bot

on:
  schedule:
    # רק גיבוי. ההפעלה העיקרית מגיעה מ-cron-job.org כל 5 דקות
    - cron: '2-59/5 * * 1-4,10-12 *'
  workflow_dispatch:
    inputs:
      test_telegram:
        description: 'שלח הודעת בדיקה ותמונת בדיקה לטלגרם'
        type: boolean
        default: false

concurrency:
  group: rain-bot
  cancel-in-progress: false

permissions:
  contents: write   # לפרסום status.json לענף status

jobs:
  run-weather-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: rain-state-${{ github.run_id }}
          restore-keys: rain-state-

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_DIR: state
        run: python bot.py ${{ inputs.test_telegram && '--test-telegram' || '' }}

      # פרסום המצב לדשבורד: ענף status עם commit יחיד שנדרס בכל ריצה (בלי היסטוריה מתנפחת)
      - name: Publish status
        if: ${{ always() && hashFiles('status/status.json') != '' }}
        run: |
          cd status
          git init -q -b status
          git config user.name "rain-bot"
          git config user.email "rain-bot@users.noreply.github.com"
          git add status.json
          git commit -q -m "status"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" status

      # תמונות מכ"ם של התראות ושל חשד לפספוס (נשמרות 14 יום, מופיעות בתחתית עמוד הריצה)
      - name: Upload radar images
        if: ${{ always() && hashFiles('out/*.png') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: radar-${{ github.run_id }}
          path: out/*.png
          retention-days: 14

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: rain-state-${{ github.run_id }}
