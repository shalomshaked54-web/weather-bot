name: Tests

# בדיקות לכל PR. לא שולח לטלגרם ולא נוגע במצב של הבוט החי
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Dry run against live radar and forecast
        run: python bot.py --dry-run --png out.png --save-frames out.npz

      - name: Replay saved frames
        run: python -m rainbot.replay out.npz

      - name: Upload dry-run image
        if: ${{ always() && hashFiles('out.png') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-${{ github.run_id }}
          path: |
            out.png
            out.npz
          retention-days: 7

      # זמני (3.2): בדיקה שהמכ"ם של השירות המטאורולוגי נגיש מ-GitHub Actions
      - name: Probe IMS radar reachability
        continue-on-error: true
        run: |
          curl -s -o idx.json -w "index: %{http_code} %{size_download}B %{time_total}s\n" --max-time 20 -A "Mozilla/5.0 (rain-alert-bot)" -H "Referer: https://ims.gov.il/he/RadarSatellite" https://ims.gov.il/he/radar_satellite || true
          head -c 300 idx.json; echo
          curl -s -o img.png -w "image: %{http_code} %{size_download}B\n" --max-time 20 -A "Mozilla/5.0 (rain-alert-bot)" https://ims.gov.il/sites/default/files/ims_data/map_images/IMSRadar4GIS/IMSRadar4GIS_202611071030_0.png || true
          file img.png || true
