name: Tests

# בדיקות לכל PR. לא שולח לטלגרם ולא נוגע במצב של הבוט החי
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Dry run against live radar and forecast
        run: python bot.py --dry-run --png out.png --save-frames out.npz

      - name: Replay saved frames
        run: python -m rainbot.replay out.npz

      - name: Upload dry-run image
        if: ${{ always() && hashFiles('out.png') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-${{ github.run_id }}
          path: |
            out.png
            out.npz
          retention-days: 7


      # 3.2: בדיקה לאחור על אירועי הגשם של 7-8 בנובמבר מהארכיון של מכ"ם השירות המטאורולוגי.
      # מידע בלבד (לא מכשיל את הבדיקות). הדוח נשמר כ-artifact
      - name: Backtest on real events (IMS archive)
        continue-on-error: true
        run: python -m rainbot.backtest --start 2026-11-07T06:00 --end 2026-11-08T16:00 --out backtest/report.json --seed-state backtest/seed_state.json

      - name: Upload backtest report
        if: ${{ always() && hashFiles('backtest/*') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ github.run_id }}
          path: backtest/*
          retention-days: 30
