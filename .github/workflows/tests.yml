name: Tests

# בדיקות לכל PR. לא שולח לטלגרם ולא נוגע במצב של הבוט החי
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Dry run against live radar and forecast
        run: python bot.py --dry-run --png out.png --save-frames out.npz

      - name: Replay saved frames
        run: python -m rainbot.replay out.npz

      - name: Upload dry-run image
        if: ${{ always() && hashFiles('out.png') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-${{ github.run_id }}
          path: |
            out.png
            out.npz
          retention-days: 7
